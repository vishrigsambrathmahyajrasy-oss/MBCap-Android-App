    <script>
      // Suppress harmless Vite HMR WebSocket errors in iframe environment
      window.addEventListener('error', function(event) {
        if (event && event.message && event.message.includes('WebSocket')) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && (event.reason ? (event.reason.message || String(event.reason)) : '');
        if (reason && reason.includes('WebSocket')) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
